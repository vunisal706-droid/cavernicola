<script>
function checkOrientation(){
  const isMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(navigator.userAgent);
  const isPortrait = window.innerHeight > window.innerWidth;
  if(isMobile && isPortrait){
    document.body.classList.add('mobile-portrait');
  }else{
    document.body.classList.remove('mobile-portrait');
  }
}

checkOrientation();
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', checkOrientation);

const C=document.getElementById('C'),$=C.getContext('2d');
const W=480,H=270;

// === Renderizado en alta resolución: gráficos nítidos ===
let RS=1;
function resizeCanvas(){
  const cont=document.getElementById('game-container');
  const rect=cont.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,3);
  // Tope 3×: nítido y ligero también en pizarras 4K y PCs lentos
  RS=Math.max(1,Math.min(3,(rect.width*dpr)/W));
  C.width=Math.round(W*RS);
  C.height=Math.round(H*RS);
  $.imageSmoothingEnabled=true;
  if('imageSmoothingQuality' in $)$.imageSmoothingQuality='high';
  $.lineJoin='round';
  $.lineCap='round';
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);
window.addEventListener('orientationchange',()=>setTimeout(resizeCanvas,300));
document.addEventListener('fullscreenchange',()=>setTimeout(resizeCanvas,150));
document.addEventListener('webkitfullscreenchange',()=>setTimeout(resizeCanvas,150));

// Los sprites llevan tamaño lógico (_lw/_lh): dibujarlos siempre a ese tamaño
const _drawImage=$.drawImage.bind($);
$.drawImage=function(img,dx,dy,dw,dh){
  if(img&&img._lw!==undefined&&dw===undefined)return _drawImage(img,dx,dy,img._lw,img._lh);
  if(dw===undefined)return _drawImage(img,dx,dy);
  return _drawImage(img,dx,dy,dw,dh);
};

// === Pantalla completa en móvil al primer toque ===
function goFullscreen(){
  const el=document.documentElement;
  const fn=el.requestFullscreen||el.webkitRequestFullscreen;
  if(fn && !document.fullscreenElement && !document.webkitFullscreenElement){
    try{
      const p=fn.call(el,{navigationUI:'hide'});
      if(p&&p.then)p.then(()=>{
        if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});
      }).catch(()=>{});
    }catch(e){}
  }
}
if(window.matchMedia&&matchMedia('(pointer:coarse)').matches){
  document.addEventListener('touchend',goFullscreen,{passive:true});
}

const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx;
function initAudio(){if(!audioCtx)audioCtx=new AudioCtx()}
function snd(freq,dur,type='square',vol=0.06){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime+dur);
}
function sfxJump(){snd(250,0.12);setTimeout(()=>snd(350,0.08),40)}
function sfxHit(){snd(100,0.25,'sawtooth',0.08)}
function sfxShoot(){snd(600,0.07);setTimeout(()=>snd(450,0.05),25)}
function sfxPickup(){snd(500,0.08);setTimeout(()=>snd(700,0.08),70);setTimeout(()=>snd(900,0.12),140)}
function sfxDeath(){snd(150,0.35,'sawtooth',0.1);setTimeout(()=>snd(80,0.4,'sawtooth',0.08),180)}
function sfxChest(){snd(350,0.08);setTimeout(()=>snd(550,0.08),90);setTimeout(()=>snd(750,0.12),180)}
function sfxClick(){snd(700,0.04)}
function sfxRoar(){snd(80,0.5,'sawtooth',0.15);setTimeout(()=>snd(60,0.4,'sawtooth',0.12),200)}

const STORY=[
  {title:'AÑO 1491',subtitle:'Santa Fe, Granada',text:'Mientras los Reyes Católicos asedian Granada,\nun joven troglodita del clan de Santa Fe\ndescubre un portal del tiempo.',color:'#ffd700',bg:'#0a0818'},
  {title:'EL PORTAL',subtitle:'Viaje a la prehistoria',text:'Una extraña cueva cerca del campamento real\nlo transporta 65 millones de años atrás.\nDebe sobrevivir y encontrar el camino de vuelta.',color:'#ff6030',bg:'#180808'},
  {title:'TU MISIÓN',subtitle:'Supervivencia prehistórica',text:'Atraviesa la jungla, la cueva misteriosa,\nla sabana y el volcán activo.\nDerrota a los dinosaurios y encuentra las piezas\ndel portal para regresar a Santa Fe.',color:'#60ff60',bg:'#081808'},
  {title:'¡CUIDADO!',subtitle:'Peligros jurásicos',text:'Pterodáctilos, velociraptores y T-Rex\nacechan en cada sombra.\n¡Usa tu ingenio troglodita!',color:'#ff4040',bg:'#180808'},
];

const PAL={
  skin:'#d4a574',skinDark:'#b08050',
  spots:'#2a1a0a',
  leopard:'#e8c880',leopardDark:'#c4a050',
  grass:'#4a8a2a',grassLight:'#6ab84a',
  dirt:'#5a4a3a',dirtDark:'#3a2a1a',
  stone:'#7a7a8a',stoneDark:'#5a5a6a',
  wood:'#6a4a2a',woodLight:'#8a6a4a',
  fire:'#ff6020',fireLight:'#ff9040',
  bone:'#e8e0d0',
};

let state='menu',frame=0,shake=0,flashTimer=0,currentLevel=1,maxLevels=4;
let playerWeapon='stone';
let score=0,lives=3,armorOn=true;
let platforms,enemies,projectiles,particles,pickups,chests,decorations;
let camX=0,storyPage=0,storyTimer=0,menuAnim=0;
let levelTransitionTimer=0;
let isTransitioning=false;
let levelMessageTimer=0;
let currentLevelName='';
let chestsOpened=0;
let totalChests=0;
const GRAV=0.32,JUMP=-7.2,SPEED=2.0,FIRE_RATE=20;
const LEVEL_W=4800,GROUND_Y=215;

let mathQuiz={
  active:false,
  chest:null,
  question:'',
  answer:0,
  isAddition:true,
  input:'',
  correct:false,
  showResult:0,
  keyboard:{buttons:[],hoveredBtn:null}
};

const P={x:40,y:GROUND_Y-28,w:16,h:28,vx:0,vy:0,dir:1,onGround:false,
  attacking:false,attackTimer:0,invuln:0,fireCd:0,anim:0,dead:false,deathTimer:0};

const keys={};
document.addEventListener('keydown',e=>{
  initAudio();
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.up=true;
  if(e.key==='ArrowDown'||e.key==='s')keys.down=true;
  if(e.key==='z'||e.key==='x'||e.key==='j'||e.key==='k')keys.fire=true;
  if(e.key==='Enter')keys.enter=true;
  
  if(mathQuiz.active){
    // Capturar números tanto del teclado principal como del numpad
    const keyNum=parseInt(e.key);
    if(!isNaN(keyNum)&&keyNum>=0&&keyNum<=9){
      if(mathQuiz.input.length<2){
        mathQuiz.input+=String(keyNum);
        sfxClick();
      }
      e.preventDefault();
    }else if(e.key==='Backspace'||e.keyCode===8){
      mathQuiz.input=mathQuiz.input.slice(0,-1);
      sfxClick();
      e.preventDefault();
    }else if(e.key==='Enter'||e.keyCode===13){
      if(mathQuiz.input.length>0)checkMathAnswer();
      e.preventDefault();
    }
    
  }
});

const releaseAll=()=>{for(const k in keys)if(typeof keys[k]==='boolean')keys[k]=false;document.querySelectorAll('.pressed').forEach(b=>b.classList.remove('pressed'));};
window.addEventListener('blur',releaseAll);
document.addEventListener('visibilitychange',()=>{releaseAll();lastT=performance.now();acc=0;});

document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.up=false;
  if(e.key==='ArrowDown'||e.key==='s')keys.down=false;
  if(e.key==='z'||e.key==='x'||e.key==='j'||e.key==='k')keys.fire=false;
  if(e.key==='Enter')keys.enter=false;
});

document.querySelectorAll('[data-key]').forEach(btn=>{
  const k=btn.dataset.key;
  const on=()=>{initAudio();keys[k]=true;btn.classList.add('pressed')};
  const off=()=>{keys[k]=false;btn.classList.remove('pressed')};
  // Pointer Events: igual con dedo, ratón o lápiz (pizarras digitales)
  btn.addEventListener('pointerdown',e=>{e.preventDefault();on();try{btn.setPointerCapture(e.pointerId)}catch(_){}});
  btn.addEventListener('pointerup',off);
  btn.addEventListener('pointercancel',off);
  btn.addEventListener('lostpointercapture',off);
  btn.addEventListener('contextmenu',e=>e.preventDefault());
});

let mouseX=0,mouseY=0;
C.addEventListener('mousemove',e=>{
  const rect=C.getBoundingClientRect();
  mouseX=(e.clientX-rect.left)*(W/rect.width);
  mouseY=(e.clientY-rect.top)*(H/rect.height);
});
C.addEventListener('click',e=>{
  initAudio();
  if(mathQuiz.active)handleKeyboardClick();
});
C.addEventListener('touchstart',e=>{
  initAudio();
  if(e.touches.length>0){
    const rect=C.getBoundingClientRect();
    mouseX=(e.touches[0].clientX-rect.left)*(W/rect.width);
    mouseY=(e.touches[0].clientY-rect.top)*(H/rect.height);
    if(mathQuiz.active)handleKeyboardClick();
  }
  e.preventDefault();
});

function handleKeyboardClick(){
  // Recrear teclado para asegurar posiciones correctas
  createVirtualKeyboard();

  let clicked=false;
  for(const btn of mathQuiz.keyboard.buttons){
    if(mouseX>=btn.x&&mouseX<=btn.x+btn.w&&mouseY>=btn.y&&mouseY<=btn.y+btn.h){
      if(btn.value==='check'){
        if(mathQuiz.input.length>0)checkMathAnswer();
      }else if(btn.value==='back'){
        mathQuiz.input=mathQuiz.input.slice(0,-1);
        sfxClick();
      }else{
        // Asegurar que solo se agreguen números
        const num=parseInt(btn.value);
        if(!isNaN(num)&&mathQuiz.input.length<2){
          mathQuiz.input+=String(num);
          sfxClick();
        }
      }
      clicked=true;
      break;
    }
  }
  return clicked;
}

function mkSpr(name,w,h,fn){
  // Sprites supermuestreados a 4x para gráficos nítidos
  const SS=4;
  const c=document.createElement('canvas');
  c.width=w*SS;
  c.height=h*SS;
  c._lw=w;
  c._lh=h;
  const x=c.getContext('2d');
  x.scale(SS,SS);
  fn(x);
  SC[name]=c;
}

const SC={};

/* ═══════════ GRÁFICOS 2.0 · personajes y objetos dibujados con formas suaves ═══════════ */
const OL='#2b1a10';
function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// Forma cerrada y suave que pasa cerca de los puntos dados
function blob(x,pts,fill,stroke,lw){
  const n=pts.length;x.beginPath();
  x.moveTo((pts[n-1][0]+pts[0][0])/2,(pts[n-1][1]+pts[0][1])/2);
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];x.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}
  x.closePath();
  if(fill){x.fillStyle=fill;x.fill();}
  if(stroke){x.strokeStyle=stroke;x.lineWidth=lw||0.8;x.lineJoin='round';x.stroke();}
}
function poly(x,pts,fill,stroke,lw){
  x.beginPath();x.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)x.lineTo(pts[i][0],pts[i][1]);x.closePath();
  if(fill){x.fillStyle=fill;x.fill();}
  if(stroke){x.strokeStyle=stroke;x.lineWidth=lw||0.8;x.lineJoin='round';x.stroke();}
}
function oval(x,cx,cy,rx,ry,fill,stroke,lw,rot){
  x.beginPath();x.ellipse(cx,cy,rx,ry,rot||0,0,Math.PI*2);
  if(fill){x.fillStyle=fill;x.fill();}
  if(stroke){x.strokeStyle=stroke;x.lineWidth=lw||0.8;x.stroke();}
}
function limb(x,x1,y1,x2,y2,w,col){
  x.lineCap='round';x.strokeStyle=OL;x.lineWidth=w+1.4;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();
  x.strokeStyle=col;x.lineWidth=w;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();
}
function rrect(x,X,Y,w,h,r,fill,stroke,lw){
  x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();
  if(fill){x.fillStyle=fill;x.fill();}
  if(stroke){x.strokeStyle=stroke;x.lineWidth=lw||0.8;x.stroke();}
}
function eye(x,cx,cy,r,look,angry){
  oval(x,cx,cy,r,r*1.1,'#fff',OL,0.5);
  oval(x,cx+(look||0)*r*0.35,cy+0.1,r*0.5,r*0.55,'#1a1008');
  oval(x,cx+(look||0)*r*0.35+r*0.18,cy-r*0.25,r*0.18,r*0.18,'#fff');
  if(angry){x.strokeStyle=OL;x.lineWidth=0.9;x.lineCap='round';x.beginPath();x.moveTo(cx-r*1.3,cy-r*1.5);x.lineTo(cx+r*1.1,cy-r*0.7);x.stroke();}
}

function drawCaveman(x,animFrame,attacking,jumping,dir){
  const skin=PAL.skin,skinD=PAL.skinDark,fur='#e9b949',furD='#c8922a',hair='#3a2414';
  // Piernas
  let l1=[8,20,7.5,26],l2=[12,20,12.5,26];
  if(jumping){l1=[8,20,5.5,24];l2=[12,20,15,23.5];}
  else if(animFrame===1){l1=[8,20,5,25.5];l2=[12,20,15,25.5];}
  else if(animFrame===2){l1=[8,20,10.5,26];l2=[12,20,9,26];}
  limb(x,l1[0],l1[1],l1[2],l1[3],3,skinD);
  oval(x,l1[2]+1,l1[3]+0.8,2.4,1.3,skinD,OL,0.6);
  // Brazo de atrás
  if(jumping)limb(x,7,13,3.5,8.5,2.6,skinD);
  else limb(x,7,13,4.5+(animFrame===1?1.5:animFrame===2?-0.5:0),18,2.6,skinD);
  limb(x,l2[0],l2[1],l2[2],l2[3],3,skin);
  oval(x,l2[2]+1,l2[3]+0.8,2.4,1.3,skin,OL,0.6);
  // Cuerpo con piel de leopardo
  blob(x,[[5.5,12],[10,10.5],[14.5,12],[15,18],[14,22.5],[10,21.5],[6,22.5],[5,18]],fur,OL,0.8);
  x.save();x.beginPath();x.rect(4,10,12,13);x.clip();
  [[7.5,14.5],[11,13.5],[13,16.5],[9,17.5],[12,20],[7,20]].forEach(p=>oval(x,p[0],p[1],0.9,0.75,'#3b2413'));
  x.restore();
  blob(x,[[10,10.6],[14.4,12],[13,13.5],[9,12]],skin); // hombro al aire
  // Flecos del faldón
  x.fillStyle=furD;for(let i=0;i<4;i++){x.beginPath();x.moveTo(6+i*2.2,21.5);x.lineTo(7.1+i*2.2,23.6);x.lineTo(8.2+i*2.2,21.5);x.fill();}
  // Cabeza
  blob(x,[[4.5,8],[4.5,3],[9,0.6],[14.5,1.8],[15.5,5.5],[13,6.5],[8,5.5],[6.5,10.5]],hair,OL,0.8); // melena
  oval(x,10.6,7.2,4.6,4.4,skin,OL,0.8);

function generateMathQuestion(){
  let a,b,ans,text,isAdd;
  
  // Alternar entre suma y resta
  if(mathQuiz.isAddition===undefined){
    mathQuiz.isAddition=true;
  }else{
    mathQuiz.isAddition=!mathQuiz.isAddition;
  }
  isAdd=mathQuiz.isAddition;
  
  if(isAdd){
    // Sumas hasta 10 (resultado máximo 10)
    a=Math.floor(Math.random()*9)+1;
    b=Math.floor(Math.random()*(10-a))+1;
    ans=a+b;
    text=a+' + '+b+' = ?';
  }else{
    // Restas hasta 10 (sin negativos)
    a=Math.floor(Math.random()*9)+2;
    b=Math.floor(Math.random()*(a-1))+1;
    ans=a-b;
    text=a+' - '+b+' = ?';
  }
  
  return {a,b,ans,text,isAdd};
}

function startMathQuiz(chest){
  mathQuiz.active=true;
  mathQuiz.chest=chest;
  mathQuiz.input='';
  mathQuiz.correct=false;
  mathQuiz.showResult=0;
  const q=generateMathQuestion();
  mathQuiz.question=q.text;
  mathQuiz.answer=q.ans;
  createVirtualKeyboard();
}

function createVirtualKeyboard(){mathQuiz.keyboard.buttons=[];
  // Botones mas pequenos para que quepan todos (0-9)
  const btnW=26,btnH=26,gap=4;
  const cols=5;

  // Calcular ancho total y centrar en pantalla
  const totalWidth=cols*btnW + (cols-1)*gap;
  const startX=(W-totalWidth)/2;
  const startY=145;

  // Primera fila: 1,2,3,4,5
  for(let i=0;i<5;i++){
    mathQuiz.keyboard.buttons.push({
      x:startX+i*(btnW+gap),
      y:startY,
      w:btnW,
      h:btnH,
      value:String(i+1),
      label:String(i+1)
    });
  }

  // Segunda fila: 6,7,8,9,0
  for(let i=0;i<5;i++){
    const num=i===4?0:i+6;
    mathQuiz.keyboard.buttons.push({
      x:startX+i*(btnW+gap),
      y:startY+btnH+gap,
      w:btnW,
      h:btnH,
      value:String(num),
      label:String(num)
    });
  }

  // Tercera fila: Back y Check
  const backW=55;
  const checkW=totalWidth-backW-gap;

  mathQuiz.keyboard.buttons.push({
    x:startX,
    y:startY+2*(btnH+gap),
    w:backW,
    h:btnH,
    value:'back',
    label:'<-'
  });

  mathQuiz.keyboard.buttons.push({
    x:startX+backW+gap,
    y:startY+2*(btnH+gap),
    w:checkW,
    h:btnH,
    value:'check',
    label:'OK'
  });
}

function updateMathQuiz(){
  if(!mathQuiz.active)return;
  mathQuiz.keyboard.hoveredBtn=null;
  for(const btn of mathQuiz.keyboard.buttons){
    if(mouseX>=btn.x&&mouseX<=btn.x+btn.w&&mouseY>=btn.y&&mouseY<=btn.y+btn.h){
      mathQuiz.keyboard.hoveredBtn=btn;
      break;
    }
  }
  if(mathQuiz.showResult>0){
    mathQuiz.showResult--;
    if(mathQuiz.showResult<=0){
      mathQuiz.showResult=0;
      mathQuiz.active=false;
      mathQuiz.chest=null;
      mathQuiz.input='';
    }
  }
}

function checkMathAnswer(){
  if(mathQuiz.input.length===0)return;
  const userAns=parseInt(mathQuiz.input);
  if(userAns===mathQuiz.answer){
    mathQuiz.correct=true;
    mathQuiz.showResult=90;
    sfxChest();
    if(mathQuiz.chest){
      mathQuiz.chest.open=true;
      chestsOpened++;
      spawnPk(mathQuiz.chest.x,mathQuiz.chest.y-18,mathQuiz.chest.item);
    }
  }else{
    mathQuiz.correct=false;
    mathQuiz.showResult=60;
    sfxHit();
    mathQuiz.input='';
  }
}

function mkE(x,y,type){
  const e={x,y,type,vx:0,vy:0,hp:1,dead:false,anim:0,w:16,h:24,dir:-1,
    shootTimer:0,active:false,spawnX:x,spawnY:y,
    patrolRange:200,retreatTimer:0};
  switch(type){
    case 'ptero':e.w=24;e.h=20;e.hp=1;e.vx=-1.5;break;
    case 'raptor':e.h=24;e.hp=2;e.vx=1.8;break;
    case 'snake':e.w=32;e.h=16;e.hp=1;e.vx=-1;break;
    case 'tri':e.w=40;e.h=32;e.hp=4;e.vx=0.8;break;
    case 'trex':e.w=64;e.h=56;e.hp=25;e.vx=1.0;break;
    case 'mamut':e.w=56;e.h=48;e.hp=20;e.vx=0.9;break;
  }
  return e;
}

function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function update(){
  if(isTransitioning){
    levelTransitionTimer--;
    if(levelTransitionTimer<=30){
      P.x+=2;
      if(P.x>LEVEL_W)P.x=0;
    }
    if(levelTransitionTimer<=0){
      completeLevelTransition();
    }
    frame++;
    return;
  }

  if(state==='story'){
    storyTimer++;
    if((keys.enter||keys.fire)&&storyTimer>20){
      storyPage++;
      storyTimer=0;
      keys.enter=false;
      keys.fire=false;
      if(storyPage>=STORY.length){
        state='playing';
        startGame_();
      }
    }
    return;
  }
  
  if(state!=='playing')return;
  if(mathQuiz.active){
    updateMathQuiz();
    return;
  }
  
  frame++;

  

  if(!P.dead){
    P.vx=0;
    if(keys.left){P.vx=-SPEED;P.dir=-1;}
    if(keys.right){P.vx=SPEED;P.dir=1;}
    if(keys.up&&P.onGround){
      P.vy=JUMP;
      P.onGround=false;
      sfxJump();
    }
    P.vy+=GRAV;
    if(P.vy>8)P.vy=8;
    P.x+=P.vx;
    for(const p of platforms){
      if(overlap(P,p)){
        if(P.vx>0)P.x=p.x-P.w;
        if(P.vx<0)P.x=p.x+p.w;
      }
    }
    P.y+=P.vy;
    P.onGround=false;
    for(const p of platforms){
      if(overlap(P,p)){
        if(P.vy>0){
          P.y=p.y-P.h;
          P.vy=0;
          P.onGround=true;
        }else if(P.vy<0){
          P.y=p.y+p.h;
          P.vy=0;
        }
      }
    }
    
    if(P.y>H+100||P.y<-100||isNaN(P.x)||isNaN(P.y)){
      P.x=100;
      P.y=GROUND_Y-50;
      P.vx=0;
      P.vy=0;
      camX=0;
    }
    if(P.x<0)P.x=0;
    if(P.x>LEVEL_W-P.w)P.x=LEVEL_W-P.w;
    if(P.y>H+60)pDeath();

    if(keys.fire&&P.fireCd<=0){
      P.attacking=true;
      P.attackTimer=12;
      P.fireCd=FIRE_RATE;
      sfxShoot();
      let projW=12,projH=10,projVx=P.dir*5,projVy=0,projLife=60,damage=1;
      if(playerWeapon==='spear'){
        projW=18;projH=6;projVx=P.dir*6;damage=2;
      }else if(playerWeapon==='club'){
        projW=16;projH=16;projVx=P.dir*5;projVy=0;damage=3;
      }else if(playerWeapon==='fire'){
        projW=14;projH=14;projVx=P.dir*5;projVy=-0.5;damage=3;projLife=80;
      }
      projectiles.push({
        x:P.x+(P.dir>0?P.w:-projW),
        y:P.y+10,
        vx:projVx,
        vy:0, // SIEMPRE horizontal, nunca hacia arriba
        w:projW,
        h:projH,
        player:true,
        life:projLife,
        damage:damage,
        weapon:playerWeapon
      });
    }
    if(P.fireCd>0)P.fireCd--;
    if(P.attackTimer>0)P.attackTimer--;
    else P.attacking=false;
    if(P.invuln>0)P.invuln--;
    if(Math.abs(P.vx)>0.1)P.anim+=0.18;
    else P.anim=0;

    for(const c of chests){
      if(!c.open&&overlap(P,c)&&!mathQuiz.active){
        startMathQuiz(c);
      }
    }
    
    for(let i=pickups.length-1;i>=0;i--){
      const pk=pickups[i];
      if(overlap(P,pk)){
        sfxPickup();
        if(pk.type==='heart')lives=Math.min(lives+1,5);
        else if(pk.type==='stone'){playerWeapon='stone';score+=100;}
        else if(pk.type==='spear'){playerWeapon='spear';score+=200;}
        else if(pk.type==='club'){playerWeapon='club';score+=200;}
        else if(pk.type==='fire'){playerWeapon='fire';score+=300;}
        spawnParts(pk.x+6,pk.y+6,8,'#ffd700');
        pickups.splice(i,1);
      }
    }
  } else {
    P.deathTimer--;
    if(P.deathTimer<=0){
      if(lives<=0)state='gameover';
      else respawn();
    }
  }

  for(let i=projectiles.length-1;i>=0;i--){
    const pr=projectiles[i];
    pr.x+=pr.vx;
    pr.y+=pr.vy;
    pr.life--;
    let hit=false;
    
    if(pr.life<=0||pr.y>H+20||pr.x<0||pr.x>LEVEL_W){
      projectiles.splice(i,1);
      continue;
    }

    // Colisión con obstáculos
    for(const p of platforms){
      if(p.type==='obstacle'&&overlap(pr,p)){
        spawnParts(pr.x,pr.y,3,'#888');
        projectiles.splice(i,1);
        hit=true;
        break;
      }
    }
    if(hit)continue;
    
    if(pr.player){
      let hit=false;
      for(let j=0;j<enemies.length;j++){
        const e=enemies[j];
        if(!e.dead&&e.active&&overlap(pr,e)){
          e.hp-=(pr.damage||1);
          spawnParts(pr.x,pr.y,5,'#ff0');
          hit=true;
          
          if(e.hp<=0){
            e.dead=true;
            if(e.type==='trex')score+=5000;
            else if(e.type==='mamut')score+=4000;
            else if(e.type==='tri')score+=300;
            else if(e.type==='raptor')score+=200;
            else score+=100;
            
            spawnParts(e.x+e.w/2,e.y+e.h/2,15,'#ff4040');
            
            if((e.type==='trex'||e.type==='mamut')&&currentLevel<maxLevels){
              startNextLevel();
            }else if((e.type==='trex'||e.type==='mamut')&&currentLevel>=maxLevels){
              state='victory';
              shake=20;
            }
          }
          break;
        }
      }
      if(hit){
        projectiles.splice(i,1);
        continue;
      }
    }else{
      if(!P.dead&&P.invuln<=0&&overlap(pr,P)){
        pHit();
        projectiles.splice(i,1);
      }
    }
  }

  for(const e of enemies){
    if(e.dead)continue;
    if(!e.active&&Math.abs(e.spawnX-P.x)<350)e.active=true;
    if(!e.active)continue;
    e.anim++;

    switch(e.type){
      case 'ptero':
        e.x+=e.vx;
        e.y+=Math.sin(e.anim*0.08)*2;
        if(e.x<camX-50)e.x=camX+W+30;
        break;

      case 'raptor':
        e.dir=P.x<e.x?-1:1;
        e.x+=e.vx*e.dir;
        e.vy+=GRAV;
        e.y+=e.vy;
        for(const p of platforms){
          if(overlap(e,p)&&e.vy>0){
            e.y=p.y-e.h;
            e.vy=0;
            if(e.anim%60===0&&Math.random()>0.7)e.vy=-6;
          }
        }
        if(e.y>H+50)e.dead=true;
        break;

      case 'snake':
        e.x+=Math.sin(e.anim*0.05)*2;
        if(Math.abs(P.x-e.x)<150&&e.anim%80===0){
          // Disparar veneno
          const dx=P.x-e.x,dy=P.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;
          projectiles.push({
            x:e.x+16,
            y:e.y+8,
            vx:(dx/d)*2.5,
            vy:(dy/d)*2.5,
            w:6,
            h:6,
            player:false,
            life:90,
            color:'#00ff00'
          });
        }
        break;

      case 'tri':
        e.x+=e.vx;
        if(e.x>e.spawnX+100||e.x<e.spawnX-100)e.vx*=-1;
        if(Math.abs(P.x-e.x)<200&&e.anim%120===0){
          // Carga
          e.vx=P.x>e.x?3:-3;
          setTimeout(()=>{e.vx=e.vx>0?0.8:-0.8;},1000);
        }
        break;

      case 'trex':
        e.dir=P.x<e.x?-1:1;
        if(Math.abs(P.x-e.x)<300)e.x+=e.vx*e.dir;
        e.shootTimer++;
        if(e.shootTimer>200){
          e.shootTimer=0;
          sfxRoar();
          const dx=P.x-e.x,dy=P.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;
          projectiles.push({
            x:e.x+32,
            y:e.y+28,
            vx:(dx/d)*3.5,
            vy:(dy/d)*3.5,
            w:12,
            h:12,
            player:false,
            life:100,
            isRock:true
          });
        }
        break;

      case 'mamut':
        e.x+=e.vx;
        if(e.x>e.spawnX+150||e.x<e.spawnX-150)e.vx*=-1;
        e.dir=P.x<e.x?-1:1;
        if(e.anim%150===0){
          const dx=P.x-e.x,dy=P.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;
          projectiles.push({
            x:e.x+28,
            y:e.y+20,
            vx:(dx/d)*2.5,
            vy:(dy/d)*2.5,
            w:10,
            h:10,
            player:false,
            life:100,
            isRock:true
          });
        }
        break;
    }
    if(!P.dead&&P.invuln<=0&&!e.dead&&overlap(e,P)){
      pHit();
      // Separar al enemigo del jugador para evitar que se quede encima
      const centerEX=e.x+e.w/2;
      const centerPX=P.x+P.w/2;
      if(centerEX<centerPX){
        e.x-=15; // Empujar enemigo a la izquierda
        e.vx=-Math.abs(e.vx||1);
      }else{
        e.x+=15; // Empujar enemigo a la derecha
        e.vx=Math.abs(e.vx||1);
      }
      e.retreatTimer=40; // Tiempo de "retirada" para que no vuelva inmediatamente
    }
  }

  for(const pk of pickups){
    pk.ft=(pk.ft||0)+0.05;
    pk.dy=pk.y+Math.sin(pk.ft)*3;
    pk.life--;
    if(pk.life<=0)pickups.splice(pickups.indexOf(pk),1);
  }
  
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=0.08;
    p.life--;
    if(p.life<=0)particles.splice(i,1);
  }

  const ct=P.x-W/3;
  camX+=(ct-camX)*0.08;
  if(camX<0)camX=0;
  if(camX>LEVEL_W-W)camX=LEVEL_W-W;
  if(shake>0){
    shake*=0.9;
    if(shake<0.5)shake=0;
  }
  if(flashTimer>0)flashTimer--;
  if(levelMessageTimer>0)levelMessageTimer--;
}

function pHit(){
  if(P.invuln>0||P.dead)return;
  sfxHit();
  shake=6;
  flashTimer=5;

  // Calcular dirección del empuje (alejarse del enemigo más cercano)
  let pushDirX=0;
  let nearestDist=9999;
  for(const e of enemies){
    if(!e.dead&&e.active){
      const dx=P.x-e.x;
      const dy=P.y-e.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<nearestDist&&dist<60){
        nearestDist=dist;
        pushDirX=dx>0?1:-1;
      }
    }
  }

  // Aplicar knockback al jugador
  if(pushDirX!==0){
    P.vx=pushDirX*4; // Empuje horizontal fuerte
    P.vy=-3; // Pequeño salto hacia arriba
    P.x+=pushDirX*8; // Separación inmediata
  }else{
    P.vx=P.dir*-3;
    P.vy=-2;
  }

  if(armorOn){
    armorOn=false;
    P.invuln=120; // Aumentado para dar tiempo de reacción
    spawnParts(P.x+8,P.y+14,12,PAL.skin);
  }else pDeath();
}

function pDeath(){
  P.dead=true;
  P.deathTimer=80;
  lives--;
  sfxDeath();
  shake=10;
  spawnParts(P.x+8,P.y+14,20,'#ff3030');
}

function respawn(){
  P.dead=false;
  P.x=Math.max(0,P.x-200);
  P.y=100;
  P.vx=0;
  P.vy=0;
  P.invuln=120;
  armorOn=true;
}

function spawnPk(x,y,type){
  pickups.push({
    x,y,dy:y,
    w:type==='heart'?12:14,
    h:type==='heart'?12:14,
    type,
    life:600,
    ft:0
  });
}

function spawnParts(x,y,n,col){
  for(let i=0;i<n;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*5,
      vy:(Math.random()-0.5)*5-2,
      life:18+Math.random()*18,
      color:col,
      size:1+Math.random()*2
    });
  }
}

function draw(){
  $.fillStyle='#000';
  $.fillRect(0,0,W,H);
  if(state==='menu'){drawMenu();return;}
  if(state==='story'){drawStory();return;}
  if(state==='gameover'){drawGO();return;}
  if(state==='victory'){drawWin();return;}

  const sx=shake?(Math.random()-0.5)*shake:0;
  const sy=shake?(Math.random()-0.5)*shake:0;
  $.save();
  $.translate(sx,sy);
  drawBg();
  $.save();
  $.translate(-camX,0);
  drawPlats();
  drawDeco();
  drawChests();
  drawPks();
  drawProjs();
  drawEns();
  if(!P.dead)drawP();
  drawParts();
  $.restore();
  drawFx();
  
  if(flashTimer>0){
    $.fillStyle=`rgba(255,255,255,${flashTimer/8})`;
    $.fillRect(0,0,W,H);
  }
  
  if(isTransitioning){
    $.fillStyle='rgba(0,0,0,0.7)';
    $.fillRect(0,0,W,H);
    $.font='bold 20px Arial';
    $.fillStyle='#ffd700';
    $.textAlign='center';
    $.fillText('¡NIVEL COMPLETADO!',W/2,H/2);
    $.font='14px Arial';
    $.fillStyle='#fff';
    $.fillText('Viajando al siguiente período...',W/2,H/2+30);
    $.textAlign='left';
  }
  
  drawHUD();
  drawMathQuiz();
  $.restore();
}

const LW=480;                    // ancho lógico de cada capa (se repite sin costura)
const FONDOS={},SUELOS={};
function mkLayer(w,h,fn){
  const SS=3,c=document.createElement('canvas');c.width=w*SS;c.height=h*SS;c._lw=w;c._lh=h;
  const x=c.getContext('2d');x.scale(SS,SS);x.lineJoin='round';x.lineCap='round';fn(x);return c;
}
// Perfil de colinas que encaja consigo mismo al repetirse
function perfil(x,base,amps,fases,fill,h){
  x.beginPath();x.moveTo(0,h);
  for(let X=0;X<=LW;X+=4){let y=base;for(let i=0;i<amps.length;i++)y+=amps[i]*Math.sin(X/LW*Math.PI*2*(i+1)+fases[i]);x.lineTo(X,y);}
  x.lineTo(LW,h);x.closePath();x.fillStyle=fill;x.fill();
}
function alturaPerfil(X,base,amps,fases){let y=base;for(let i=0;i<amps.length;i++)y+=amps[i]*Math.sin(X/LW*Math.PI*2*(i+1)+fases[i]);return y;}
// Dibuja algo tres veces (centro y ambos lados) para que no se corte en el borde de la capa
function tres(x,X,fn){for(const d of[-LW,0,LW]){x.save();x.translate(X+d,0);fn(x);x.restore();}}
function cielo(x,stops){const g=x.createLinearGradient(0,0,0,H);stops.forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,LW,H);}

function construirSuelo(lv){
  const T=96,r=rng32(lv*31+7);
  return mkLayer(T,66,x=>{
    const Y=6; // la franja deja 6 px por encima para la hierba
    const col={1:['#6b4a2c','#4d331d','#7d5a36'],2:['#4a4870','#2e2c4a','#5e5c88'],3:['#c79a4c','#a37836','#dcb468'],4:['#3c2224','#241214','#55302e']}[lv];
    const g=x.createLinearGradient(0,Y,0,66);g.addColorStop(0,col[0]);g.addColorStop(1,col[1]);x.fillStyle=g;x.fillRect(0,Y,T,60);
    for(let i=0;i<22;i++){const px=r()*T,py=Y+10+r()*46,rx=2+r()*4,ry=1.4+r()*2.4;
      for(const d of[-T,0,T]){oval(x,px+d,py,rx,ry,i%3?col[1]:col[2]);}}
    if(lv===1){
      x.fillStyle='#3d8f33';x.fillRect(0,Y,T,6);
      x.fillStyle='#3d8f33';for(let X=0;X<T;X+=8){x.beginPath();x.arc(X+4,Y+6,4.4,0,Math.PI);x.fill();}
      x.fillStyle='#63c34a';x.fillRect(0,Y,T,2.4);
      for(let i=0;i<26;i++){const X=r()*T,hh=3+r()*4.5;for(const d of[-T,0,T]){x.fillStyle=i%2?'#63c34a':'#4aa83c';x.beginPath();x.moveTo(X+d-1.2,Y+1);x.lineTo(X+d+(i%3-1),Y-hh);x.lineTo(X+d+1.2,Y+1);x.fill();}}
    }else if(lv===2){
      x.fillStyle='#55537a';x.fillRect(0,Y,T,3);
      x.fillStyle='#6c6a94';for(let X=0;X<T;X+=24){rrect(x,X+2,Y+0.5,13+((X/24)%2)*5,3.4,1.5,'#6c6a94');}
      for(let i=0;i<5;i++){const X=r()*T,py=Y+16+r()*34;oval(x,X,py,1.6,1.6,i%2?'#6fe0ff':'#c48cff');}
    }else if(lv===3){
      x.fillStyle='#e6c476';x.fillRect(0,Y,T,4);x.fillStyle='#f4dc9a';x.fillRect(0,Y,T,1.6);
      x.strokeStyle='#8a6428';x.lineWidth=0.8;for(let i=0;i<5;i++){const X=r()*T,py=Y+12+r()*36;x.beginPath();x.moveTo(X,py);x.lineTo(X+5,py+3);x.lineTo(X+3,py+8);x.stroke();}
      for(let i=0;i<14;i++){const X=r()*T,hh=3+r()*5;for(const d of[-T,0,T]){x.strokeStyle=i%2?'#d9a52c':'#b8861c';x.lineWidth=1;x.beginPath();x.moveTo(X+d,Y+1);x.lineTo(X+d+(i%3-1)*1.4,Y-hh);x.stroke();}}
    }else{
      x.fillStyle='#5e3a36';x.fillRect(0,Y,T,3);x.fillStyle='#7a4c44';x.fillRect(0,Y,T,1.2);
      x.lineCap='round';for(let i=0;i<4;i++){const X=8+i*24+r()*6,py=Y+8+r()*20;
        x.strokeStyle='#ff6a1a';x.lineWidth=1.6;x.beginPath();x.moveTo(X,py);x.lineTo(X+5,py+7);x.lineTo(X+2,py+14);x.lineTo(X+8,py+22);x.stroke();
        x.strokeStyle='#ffd24a';x.lineWidth=0.6;x.beginPath();x.moveTo(X,py);x.lineTo(X+5,py+7);x.lineTo(X+2,py+14);x.stroke();}
    }
  });
}

function drawProjs(){
  for(const pr of projectiles){
    if(pr.player){
      $.save();
      $.translate(pr.x,pr.y);
      if(pr.vx<0){
        $.scale(-1,1);
        $.translate(-pr.w,0);
      }
      $.drawImage(SC[pr.weapon],0,0);
      $.restore();
    }else{
      if(pr.isRock){
        $.drawImage(SC['enemyRock'],pr.x,pr.y);
      }else{
        $.fillStyle=pr.color||'#00ff00';
        $.beginPath();
        $.arc(pr.x+3,pr.y+3,3.5,0,Math.PI*2);
        $.fill();
      }
    }
  }
}

function drawEns(){
  for(const e of enemies){
    if(e.dead||!e.active||e.x+e.w<camX-50||e.x>camX+W+50)continue;
    $.save();
    const fl=e.dir<0;
    // Si está en modo retirada, alejarse del jugador
    if(e.retreatTimer>0){
      e.retreatTimer--;
      const dx=P.x-e.x;
      if(dx>0)e.x-=e.vx*2; // Jugador a la derecha, mover izquierda
      else e.x+=e.vx*2; // Jugador a la izquierda, mover derecha
    }
    sombra(e);

    // En nivel 2 (cueva), agregar iluminación a los enemigos
    if(currentLevel===2){
      const centerX=e.x+e.w/2;
      const centerY=e.y+e.h/2;
      const radius=50+Math.sin(frame*0.1)*5; // Radio pulsante

      // Glow exterior (naranja/cálido como antorcha)
      const grd=$.createRadialGradient(centerX,centerY,5,centerX,centerY,radius);
      grd.addColorStop(0,'rgba(255,200,100,0.4)');
      grd.addColorStop(0.5,'rgba(255,150,50,0.2)');
      grd.addColorStop(1,'rgba(255,100,30,0)');

      $.fillStyle=grd;
      $.beginPath();
      $.arc(centerX,centerY,radius,0,Math.PI*2);
      $.fill();

      // Brillo central más intenso
      const grd2=$.createRadialGradient(centerX,centerY,2,centerX,centerY,15);
      grd2.addColorStop(0,'rgba(255,255,200,0.6)');
      grd2.addColorStop(1,'rgba(255,200,100,0)');

      $.fillStyle=grd2;
      $.beginPath();
      $.arc(centerX,centerY,15,0,Math.PI*2);
      $.fill();
    }

    switch(e.type){
      case 'ptero':{
        const fr=Math.floor(e.anim/8)%2;
        $.drawImage(SC['ptero'+fr],e.x,e.y);
        break;
      }
      case 'raptor':{
        const fr=Math.floor(e.anim/10)%2;
        if(fl){
          $.translate(e.x+e.w,e.y);
          $.scale(-1,1);
          $.drawImage(SC['raptor'+fr],0,0);
        }else{
          $.drawImage(SC['raptor'+fr],e.x,e.y);
        }
        break;
      }
      case 'snake':
        $.drawImage(SC['snake0'],e.x,e.y);
        break;
      case 'tri':
        if(fl){
          $.translate(e.x+e.w,e.y);
          $.scale(-1,1);
          $.drawImage(SC['tri0'],0,0);
        }else{
          $.drawImage(SC['tri0'],e.x,e.y);
        }
        break;
      case 'trex':{
        if(fl){
          $.translate(e.x+e.w,e.y);
          $.scale(-1,1);
          $.drawImage(SC['trex0'],0,0);
        }else{
          $.drawImage(SC['trex0'],e.x,e.y);
        }
        // Barra de vida
        $.restore();
        $.save();
        const bx=e.x,by=e.y-18;
        $.fillStyle='rgba(0,0,0,0.7)';
        $.fillRect(bx-2,by-1,68,8);
        $.fillStyle='#300';
        $.fillRect(bx,by,64,6);
        $.fillStyle='#ff4400';
        $.fillRect(bx,by,64*(e.hp/25),6);
        $.font='bold 7px Arial';
        $.fillStyle='#fff';
        $.textAlign='center';
        $.fillText('T-REX',bx+32,by-3);
        break;
      }
      case 'mamut':{
        if(fl){
          $.translate(e.x+e.w,e.y);
          $.scale(-1,1);
          $.drawImage(SC['mamut0'],0,0);
        }else{
          $.drawImage(SC['mamut0'],e.x,e.y);
        }
        $.restore();
        $.save();
        const bx=e.x,by=e.y-14;
        $.fillStyle='rgba(0,0,0,0.7)';
        $.fillRect(bx-2,by-1,60,8);
        $.fillStyle='#300';
        $.fillRect(bx,by,56,6);
        $.fillStyle='#8a7a6a';
        $.fillRect(bx,by,56*(e.hp/20),6);
        $.font='bold 7px Arial';
        $.fillStyle='#fff';
        $.textAlign='center';
        $.fillText('MAMUT',bx+28,by-3);
        break;
      }
    }
    $.restore();
  }
}

function drawP(){
  sombra(P);
  $.save();
  if(P.invuln>0&&Math.floor(P.invuln/3)%2)$.globalAlpha=0.4;
  
  let spr;
  if(P.attacking)spr='trogl_a';
  else if(!P.onGround)spr='trogl_j';
  else{
    const fr=Math.floor(P.anim)%3;
    spr='trogl'+fr;
  }
  
  const s=SC[spr];
  if(!s){
    $.restore();
    return;
  }
  
  if(P.dir<0){
    $.translate(P.x+P.w,P.y);
    $.scale(-1,1);
    $.drawImage(s,0,0);
  }else{
    $.drawImage(s,P.x,P.y);
  }
  $.restore();
}

function sombra(o){
  const alto=GROUND_Y-(o.y+o.h);if(alto<-2||alto>110)return;
  const k=1-alto/130;$.fillStyle='rgba(0,0,0,'+(0.24*k)+')';$.beginPath();$.ellipse(o.x+o.w/2,GROUND_Y+0.6,o.w*0.48*k,2.2*k,0,0,6.3);$.fill();
}

function drawParts(){
  for(const p of particles){
    $.fillStyle=p.color;$.globalAlpha=Math.min(1,p.life/10);
    $.beginPath();$.arc(p.x,p.y,p.size*0.7,0,6.3);$.fill();
  }
  $.globalAlpha=1;
}

// Ambiente por encima del mundo: motas de luz, penumbra de la cueva, polvo y ascuas
function drawFx(){

function drawMathQuiz(){
  if(!mathQuiz.active)return;

  // Fondo oscuro semitransparente
  $.fillStyle='rgba(0,0,0,0.9)';
  $.fillRect(0,0,W,H);

  // Panel del quiz
  const panelW=360;
  const panelH=140;
  const panelX=(W-panelW)/2;
  const panelY=15;

  // Fondo del panel
  $.fillStyle='#2a2a3a';
  $.strokeStyle='#5a5a6a';
  $.lineWidth=2;
  $.fillRect(panelX,panelY,panelW,panelH);
  $.strokeRect(panelX,panelY,panelW,panelH);

  // Titulo
  $.font='bold 14px Arial';
  $.fillStyle='#ffd700';
  $.textAlign='center';
  $.fillText('RESUELVE PARA ABRIR LA CAJA',W/2,panelY+20);

  // Indicador de suma o resta
  $.font='11px Arial';
  $.fillStyle=mathQuiz.isAddition?'#60ff60':'#ff6060';
  const opText=mathQuiz.isAddition?'SUMA (+)':'RESTA (-)';
  $.fillText(opText,W/2,panelY+35);

  // Pregunta grande
  $.font='bold 28px Arial';
  $.fillStyle='#ffffff';
  $.fillText(mathQuiz.question,W/2,panelY+70);

  // Input del usuario con cursor
  $.font='bold 32px Arial';
  $.fillStyle='#ffd700';
  const cursor=Math.floor(Date.now()/500)%2===0?'_':'';
  const displayText=(mathQuiz.input||'')+cursor;
  $.fillText(displayText,W/2,panelY+105);

  // Dibujar botones del teclado
  for(const btn of mathQuiz.keyboard.buttons){
    // Color segun tipo
    if(btn.value==='check'){
      $.fillStyle=mathQuiz.keyboard.hoveredBtn===btn?'#4aff4a':'#2a5a2a';
      $.strokeStyle='#4aff4a';
    }else if(btn.value==='back'){
      $.fillStyle=mathQuiz.keyboard.hoveredBtn===btn?'#ff6a6a':'#5a2a2a';
      $.strokeStyle='#ff4a4a';
    }else{
      $.fillStyle=mathQuiz.keyboard.hoveredBtn===btn?'#5a5a7a':'#3a3a4a';
      $.strokeStyle='#6a6a8a';
    }

    // Dibujar boton
    $.lineWidth=2;
    $.fillRect(btn.x,btn.y,btn.w,btn.h);
    $.strokeRect(btn.x,btn.y,btn.w,btn.h);

    // Texto del boton
    $.font='bold 14px Arial';
    $.fillStyle='#ffffff';
    $.textAlign='center';
    $.textBaseline='middle';
    $.fillText(btn.label,btn.x+btn.w/2,btn.y+btn.h/2);
  }

  // Resetear alineacion
  $.textAlign='left';
  $.textBaseline='alphabetic';

  // Mostrar resultado
  if(mathQuiz.showResult>0){
    $.font='bold 18px Arial';
    $.textAlign='center';
    if(mathQuiz.correct){
      $.fillStyle='#60ff60';
      $.fillText('CORRECTO',W/2,245);
    }else{
      $.fillStyle='#ff6060';
      $.fillText('INTENTALO DE NUEVO',W/2,245);
    }
  }

  // Instrucciones
  $.font='10px Arial';
  $.fillStyle='#888';
  $.textAlign='center';
  $.fillText('Toca los numeros o usa tu teclado',W/2,262);
}

// Lógica a 60 pasos/s fijos aunque el equipo pinte menos fotogramas
// (pizarras digitales y PCs lentos): el personaje va igual de rápido en todos.
const STEP=1000/60;
let lastT=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(now-lastT,250);
  lastT=now;
  $.setTransform(RS,0,0,RS,0,0);
  let steps=0;
  while(acc>=STEP&&steps<6){update();acc-=STEP;steps++;}
  if(steps>=6)acc=0;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
